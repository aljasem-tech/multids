name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      MULTIDS_S3_TEST_BUCKET: multids-bench
      OPENSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:latest server /data
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs minio; exit 1
      - name: Start OpenSearch
        run: |
          docker run -d --name opensearch -p 9200:9200 \
            -e discovery.type=single-node \
            -e plugins.security.disabled=true \
            -e OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m" \
            opensearchproject/opensearch:2.9.0
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:9200/ >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs opensearch; exit 1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[s3,opensearch]
          pip install "sqlalchemy>=2.0,<2.1"
      - name: Create S3 bucket
        run: |
          python - <<'PY'
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id="minioadmin",
              aws_secret_access_key="minioadmin",
              region_name="us-east-1",
          )
          s3.create_bucket(Bucket="multids-bench")
          PY
      - name: Run benchmarks and compare to baseline
        run: |
          python tools/benchmarks.py \
            --rows 20000 --docs 5000 --mib 64 --repeats 3 \
            --output benchmarks/results.json \
            --compare benchmarks/baseline.json \
            --tolerance 0.25
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results.json
