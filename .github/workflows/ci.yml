name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ 3.11, 3.12, 3.13 ]
        extras: [ "", "sqlserver" ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.extras }}" = "" ]; then pip install -e .[ai]; else pip install -e .[ai,${{ matrix.extras }}]; fi
          pip install pytest pytest-asyncio
      - name: Run tests
        run: |
          pytest -q

      - name: Install formatting tools
        run: |
          python -m pip install --upgrade pip
          pip install black==24.1 ruff==0.12 isort==5.12

      - name: Check formatting (black)
        run: |
          black --check .

      - name: Check imports & style (isort)
        run: |
          isort --check-only .

      - name: Lint with ruff
        run: |
          ruff check .

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4


      - name: Start OpenSearch (docker run)
        run: |
          docker pull opensearchproject/opensearch:2.9.0
          # increase vm.max_map_count for OpenSearch; requires sudo
          sudo sysctl -w vm.max_map_count=262144
          # run OpenSearch with increased JVM heap and ulimits recommended for containers
          docker run -d --name opensearch \
            -p 9200:9200 \
            --env "discovery.type=single-node" \
            --env "plugins.security.disabled=true" \
            --env "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g" \
            --ulimit nofile=65536:65536 \
            --ulimit memlock=-1:-1 \
            opensearchproject/opensearch:2.9.0

      - name: Wait for OpenSearch
        run: |
          for i in {1..60}; do
            if curl -sS http://localhost:9200/ >/dev/null 2>&1; then
              echo "OpenSearch ready"; exit 0
            fi
            sleep 2
          done
          docker logs opensearch
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install extras and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[ai,opensearch]
          pip install pytest pytest-asyncio

      - name: Run OpenSearch integration tests
        env:
          OPENSEARCH_URL: http://localhost:9200
        run: |
          pytest tests/integration -q
