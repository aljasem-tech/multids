name: Docs Preview

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install MkDocs and theme
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material pymdown-extensions

      - name: Build site
        run: mkdocs build --site-dir site

      - name: Configure git
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PRNUM=${{ github.event.pull_request.number }}
          OWNER=$(echo "${REPO}" | cut -d'/' -f1)
          REPO_NAME=$(echo "${REPO}" | cut -d'/' -f2)

          # clone or init gh-pages branch
          if git ls-remote --exit-code origin gh-pages; then
            git clone --depth 1 --branch gh-pages https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git gh-pages
          else
            git clone https://github.com/${REPO}.git gh-pages
            pushd gh-pages || exit 0
            git checkout --orphan gh-pages
            git rm -rf . || true
            git commit --allow-empty -m "Init gh-pages branch"
            git push https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git gh-pages
            popd || true
            git clone --depth 1 --branch gh-pages https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git gh-pages
          fi

          DEST_DIR=previews/pr-${PRNUM}
          rm -rf gh-pages/${DEST_DIR}
          mkdir -p gh-pages/${DEST_DIR}
          cp -r site/* gh-pages/${DEST_DIR}/

          pushd gh-pages
          git add -A
          git commit -m "Docs preview for PR #${PRNUM}"
          git push https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git gh-pages
          popd

      - name: Comment PR with preview link
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Docs preview for this PR is available at:

            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/previews/pr-${{ github.event.pull_request.number }}/
