name: Real Service Integration

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  s3:
    name: S3 (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    env:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://127.0.0.1:9000
      AWS_EC2_METADATA_DISABLED: "true"
      MULTIDS_S3_TEST_BUCKET: multids-it
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            pgsty/silo:latest server /data
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "MinIO ready"; exit 0
            fi
            sleep 2
          done
          docker logs minio; exit 1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[s3]
          pip install "pytest-asyncio==0.23.8"
          pip install pytest
      - name: Create bucket
        run: |
          python - <<'PY'
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id="minioadmin",
              aws_secret_access_key="minioadmin",
              region_name="us-east-1",
          )
          s3.create_bucket(Bucket="multids-it")
          print("buckets:", [b["Name"] for b in s3.list_buckets()["Buckets"]])
          PY
      - name: Run S3 integration tests
        run: pytest tests/integration/test_s3_integration.py -m real_integration -vv

  mysql:
    name: MySQL (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    env:
      MULTIDS_MYSQL_URL: mysql+asyncmy://root:root@127.0.0.1:3306/multids
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start MySQL
        run: |
          docker run -d --name mysql \
            -e MYSQL_ROOT_PASSWORD=root \
            -e MYSQL_DATABASE=multids \
            -p 3306:3306 \
            mysql:8.0 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_unicode_ci
          for i in $(seq 1 90); do
            if docker exec mysql mysqladmin ping -uroot -proot --silent >/dev/null 2>&1; then
              echo "MySQL ready"; exit 0
            fi
            sleep 2
          done
          docker logs mysql; exit 1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[mysql]
          pip install "pytest-asyncio==0.23.8"
          pip install pytest
      - name: Preflight connectivity
        run: |
          python - <<'PY'
          import asyncio
          from sqlalchemy.ext.asyncio import create_async_engine
          from sqlalchemy import text

          async def main():
              engine = create_async_engine("mysql+asyncmy://root:root@127.0.0.1:3306/multids")
              async with engine.connect() as conn:
                  value = await conn.execute(text("SELECT 1"))
                  print("mysql preflight:", value.scalar())
              await engine.dispose()

          asyncio.run(main())
          PY
      - name: Run MySQL integration tests
        run: pytest tests/integration/test_mysql_integration.py -m real_integration -vv

  mssql:
    name: SQL Server (3.11)
    runs-on: ubuntu-latest
    env:
      MULTIDS_MSSQL_DSN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=127.0.0.1,1433;DATABASE=master;UID=sa;PWD=Multids!Passw0rd;TrustServerCertificate=yes"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Start SQL Server
        run: |
          docker run -d --name mssql \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='Multids!Passw0rd' \
            -p 1433:1433 \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 90); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Multids!Passw0rd' -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server ready"; exit 0
            fi
            sleep 2
          done
          docker logs mssql; exit 1
      - name: Install ODBC driver
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc >/dev/null
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[sqlserver]
          pip install pytest "pytest-asyncio==0.23.8"
      - name: Run SQL Server integration tests
        run: pytest tests/integration/test_mssql_integration.py -m real_integration -q

  opensearch:
    name: OpenSearch (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11", "3.12", "3.13" ]
    env:
      OPENSEARCH_URL: http://127.0.0.1:9200
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Start OpenSearch
        run: |
          docker run -d --name opensearch \
            -p 9200:9200 \
            -e discovery.type=single-node \
            -e plugins.security.disabled=true \
            -e OPENSEARCH_JAVA_OPTS="-Xms512m -Xmx512m" \
            opensearchproject/opensearch:2.9.0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9200/ >/dev/null 2>&1; then
              echo "OpenSearch ready"; exit 0
            fi
            sleep 2
          done
          docker logs opensearch; exit 1
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[opensearch]
          pip install pytest "pytest-asyncio==0.23.8"
      - name: Run OpenSearch integration tests
        run: |
          pytest tests/integration/test_opensearch_integration.py \
                 tests/integration/test_opensearch_connector_integration.py \
                 tests/integration/test_opensearch_integration_detailed.py \
                 -m "integration or real_integration" -q

  athena:
    name: Athena (opt-in)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[s3]
          pip install pytest "pytest-asyncio==0.23.8"
      - name: Run Athena integration tests when configured
        env:
          MULTIDS_ATHENA_DATABASE: ${{ secrets.MULTIDS_ATHENA_DATABASE }}
          MULTIDS_ATHENA_OUTPUT_LOCATION: ${{ secrets.MULTIDS_ATHENA_OUTPUT_LOCATION }}
          MULTIDS_ATHENA_WORKGROUP: ${{ secrets.MULTIDS_ATHENA_WORKGROUP }}
          AWS_ACCESS_KEY_ID: ${{ secrets.MULTIDS_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MULTIDS_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.MULTIDS_AWS_REGION }}
        run: |
          if [ -z "${MULTIDS_ATHENA_DATABASE}" ] || [ -z "${MULTIDS_ATHENA_OUTPUT_LOCATION}" ]; then
            echo "Athena secrets not configured; skipping"
            exit 0
          fi
          pytest tests/integration/test_athena_integration.py -m real_integration -q
