site_name: multids
site_description: Async-first multi-data-source connectors for Python
site_author: multids contributors
site_url: https://aljasem-tech.github.io/multids
docs_dir: docs
repo_name: aljasem-tech/multids
repo_url: https://github.com/aljasem-tech/multids
nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: quickstart.md
  - Guides:
      - Usage: usage.md
      - Data Workflows: workflows.md
      - Reliability & Observability: observability.md
      - Support & Compatibility: support.md
      - API Reference: api.md
  - Design:
      - Retry Safety & Idempotency: phase2-contract.md
      - Hardening: phase5-hardening.md
theme:
  name: material
  language: en
  palette:
    primary: 'indigo'
    accent: 'indigo'
    scheme: default
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    logo: material/library
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - toc:
      permalink: true
